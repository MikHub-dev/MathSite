<svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="150" cy="110" rx="110" ry="90" fill="#eaf2ff" stroke="#3355aa" stroke-width="1.5"/>
  <ellipse cx="150" cy="110" rx="110" ry="30" fill="none" stroke="#88a8dd" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 60,90 A 120 90 0 0 1 230,130" fill="none" stroke="red" stroke-width="2.5"/>
  <circle cx="60" cy="90" r="4" fill="black"/>
  <text x="35" y="80" font-size="12">A</text>
